<section class="screen gameover">
  <div class="panel over-panel">
    <h2>Game Over</h2>
    <p class="cause" data-cause></p>
    <p class="length-hero" data-length>0</p>
    <p class="length-label">Length</p>
    <dl class="over-stats">
      <div>
        <dt>Kills</dt>
        <dd data-kills>0</dd>
      </div>
      <div>
        <dt>Best rank</dt>
        <dd data-rank>—</dd>
      </div>
      <div>
        <dt>Time</dt>
        <dd data-time>0:00</dd>
      </div>
    </dl>
    <p class="personal" data-best>Best: 0</p>
    <p class="badge" data-badge hidden>New best!</p>
    <div class="over-actions">
      <button type="button" class="play" data-again>Play again</button>
      <button type="button" class="ghost" data-menu>Main menu</button>
    </div>
  </div>
</section>
