<div class="hud">
  <div class="top-right">
    <ol class="board" data-board aria-label="Leaderboard"></ol>
    <p class="board-you" data-you hidden></p>
    <ul class="feed" data-feed aria-label="Kill feed"></ul>
  </div>
  <div class="status">
    <p data-length>Your length: 0</p>
    <p data-rank>Rank – of –</p>
    <p data-kills>Kills: 0</p>
  </div>
  <div class="toast-wrap">
    <p class="toast" data-toast></p>
  </div>
  <button type="button" class="mute-btn" data-mute aria-pressed="false">Mute</button>
  <button type="button" class="boost-btn" data-boost>BOOST</button>
</div>
