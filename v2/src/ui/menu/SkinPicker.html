<div class="skin-picker">
  <div class="skin-stage">
    <button type="button" class="skin-arrow" data-prev aria-label="Previous skin">‹</button>
    <canvas class="skin-preview" data-preview width="640" height="220"></canvas>
    <button type="button" class="skin-arrow" data-next aria-label="Next skin">›</button>
  </div>
  <p class="skin-name" data-skin-name></p>
  <div class="swatches" data-swatches></div>
</div>
