<section class="screen menu">
  <div class="panel menu-panel">
    <h1 class="logo">snake<span>.io</span></h1>
    <label class="nick">
      <span>Nickname</span>
      <input data-name maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Player" />
    </label>
    <div class="picker-host" data-picker></div>
    <button type="button" class="play" data-play>Play</button>
    <p class="hint">Move: mouse · Boost: hold click / Space · Mobile: drag + boost button</p>
    <p class="best" data-best>Best: 0</p>
    <button type="button" class="text-btn" data-mute>Mute</button>
  </div>
</section>
