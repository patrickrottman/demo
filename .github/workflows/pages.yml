name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install v2 dependencies
        working-directory: v2
        run: npm ci

      - name: Verify v2 (typecheck, tests, formatting)
        working-directory: v2
        run: npm run check

      - name: Build v2
        working-directory: v2
        run: npx vite build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r og _site/og
          cp -r v2/dist _site/v2
          cp CNAME _site/CNAME

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
